  :root { --accent2:#b13e5c; --text:#e9ebf1;
          --gloss: linear-gradient(180deg, rgba(255,255,255,.10) 0, rgba(255,255,255,.02) 48%, rgba(255,255,255,0) 52%),
                   linear-gradient(180deg, #67203a 0%, #55112a 55%, #470e24 100%); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; user-select:none; color:var(--text); font-family:"Manrope","Segoe UI",sans-serif; }
  button { font-family:inherit; }

  .card { position:absolute; inset:32px; border-radius:24px; overflow:hidden; background:#0e121a; border:1px solid #ffffff12;
          box-shadow:0 8px 22px rgba(0,0,0,.42); display:flex; flex-direction:column; justify-content:space-between; padding:14px; }
  .bg { position:absolute; inset:-40px; background-size:cover; background-position:center; filter:blur(40px) saturate(1.25) brightness(.36); opacity:0; transition:opacity .9s; }
  .bg.on { opacity:1; }
  .card > *:not(.bg) { position:relative; }

  .cover { width:100%; aspect-ratio:1; flex:none; border-radius:16px; background:#1d2028 center/cover no-repeat; box-shadow:0 8px 20px rgba(0,0,0,.45); transition:opacity .16s; }
  .meta { text-align:center; min-width:0; }
  .t { font-family:"Outfit","Segoe UI",sans-serif; font-weight:800; font-size:18px; line-height:1.2; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .a { font-size:13.5px; line-height:1.3; margin-top:2px; font-weight:600; color:#e9ebf1b0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seek { display:flex; align-items:center; gap:8px; font-size:11px; color:#ffffff99; font-variant-numeric:tabular-nums; }
  .seek span { width:34px; flex:none; } .seek span:first-child { text-align:right; }
  .ctl { display:flex; align-items:center; justify-content:center; gap:14px; }

  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; min-width:0; height:5px; border-radius:3px; outline:none; cursor:pointer; margin:0;
    background:linear-gradient(to right,var(--accent2) var(--p,0%),#ffffff24 var(--p,0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; opacity:0; transition:opacity .15s; }
  input[type=range]:hover::-webkit-slider-thumb, input[type=range]:active::-webkit-slider-thumb { opacity:1; }

  .ic { width:38px; height:38px; padding:0; border:0; border-radius:50%; background:none; color:#ffffffd2; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:background-color .15s, transform .12s; }
  .ic:hover { background:#ffffff16; } .ic:active { transform:scale(.88); }
  .ic svg { width:20px; height:20px; }
  .play { width:52px; height:52px; border-radius:17px; background:var(--gloss); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 2px rgba(0,0,0,.2), 0 1px 4px rgba(0,0,0,.28); transition:transform .14s ease-out; }
  .play:hover { background:var(--gloss); }
  .play:active { transform:scale(.92); transition-duration:.08s; }
  .play.bounce { animation:bounce .42s cubic-bezier(.3,.7,.3,1); }
  .play svg { width:22px; height:22px; } .play svg.pop { animation:pop .26s cubic-bezier(.2,.9,.3,1); }
  @keyframes bounce { 0% { transform:scale(.92); } 55% { transform:scale(1.045); } 100% { transform:scale(1); } }
  @keyframes pop { 0% { transform:scale(.62) rotate(-40deg); opacity:0; } 100% { transform:none; opacity:1; } }

  .top { position:absolute !important; top:10px; right:10px; display:flex; gap:6px; opacity:0; transition:opacity .2s; z-index:3; }
  .card:hover .top { opacity:1; }
  .top button { width:28px; height:28px; border:0; border-radius:50%; background:#000000a6; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px); transition:background-color .15s; }
  .top button:hover { background:#000000d6; } .top svg { width:15px; height:15px; }
  .pbar { display:none; }

  /* compact bar */
  .card[data-layout=bar] { flex-direction:row; align-items:center; justify-content:flex-start; gap:12px; padding:10px; }
  .card[data-layout=bar] .cover { width:70px; height:70px; border-radius:12px; box-shadow:0 6px 16px #0009; }
  .card[data-layout=bar] .meta { flex:1; text-align:left; }
  .card[data-layout=bar] .t { font-size:15px; } .card[data-layout=bar] .a { font-size:16px; }
  .card[data-layout=bar] .seek { display:none; }
  .card[data-layout=bar] .ctl { gap:2px; flex:none; }
  .card[data-layout=bar] .ic { width:32px; height:32px; } .card[data-layout=bar] .ic svg { width:17px; height:17px; }
  .card[data-layout=bar] .play { width:42px; height:42px; border-radius:14px; } .card[data-layout=bar] .play svg { width:19px; height:19px; }
  .card[data-layout=bar] .top { top:5px; right:7px; gap:4px; } .card[data-layout=bar] .top button { width:22px; height:22px; } .card[data-layout=bar] .top svg { width:12px; height:12px; }
  .card[data-layout=bar] .pbar { display:block; position:absolute !important; left:0; right:0; bottom:0; height:3px; background:#ffffff14; }
  .card[data-layout=bar] .pbar i { display:block; height:100%; width:var(--p,0%); background:var(--accent2); }
  @media (prefers-reduced-motion:reduce) { .play, .play svg, .bg, .cover { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="card" id="card" data-layout="card">
  <div class="bg" id="bg"></div>
  <div class="top"><button id="lay" title="Switch size"></button><button id="open" title="Open YZL Music"></button></div>
  <div class="cover" id="cover"></div>
  <div class="meta"><div class="t" id="t">Nothing playing</div><div class="a" id="a"></div></div>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" step="1" value="0"><span id="dur">0:00</span></div>
  <div class="ctl"><button class="ic" id="prev" title="Previous"></button><button class="ic play" id="play" title="Play / Pause"></button><button class="ic" id="next" title="Next"></button></div>
  <div class="pbar"><i id="pbar"></i></div>
</div>
<script>
const $ = id => document.getElementById(id);
const svg = (p, fill) => `<svg viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  prev: svg('<polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>', 1), next: svg('<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>', 1),
  play: svg('<polygon points="6 3 20 12 6 21 6 3"/>', 1), pause: svg('<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>', 1),
  open: svg('<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>'),
  small: svg('<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/>'),
  big: svg('<rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="15" x2="21" y2="15"/>')
};
$('prev').innerHTML = IC.prev; $('next').innerHTML = IC.next; $('open').innerHTML = IC.open;
const card = $('card'), fmt = s => isFinite(s) && s > 0 ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
const setP = (el, v) => el.style.setProperty('--p', v + '%');
let S = {}, layout = new URLSearchParams(location.search).get('l') === 'bar' ? 'bar' : 'card', coverKey = null, playState = null, seeking = false;
function setLayout(l, tell) {
  layout = l; card.dataset.layout = l;
  $('lay').innerHTML = l === 'card' ? IC.small : IC.big; $('lay').title = l === 'card' ? 'Smaller' : 'Larger';
  if (tell) window.api.miniLayout(l);
}
setLayout(layout, false);

function paint() {
  const has = !!S.has;
  $('t').textContent = has ? S.title : 'Nothing playing'; $('a').textContent = has ? S.artist : 'Pick a song in YZL Music';
  const key = (S.cover || '') + '|' + (S.bg || '');
  if (key !== coverKey) {
    const first = coverKey === null; coverKey = key;
    const img = S.cover ? `url("${S.cover}")` : (S.bg || '');
    const set = () => { $('cover').style.backgroundImage = img; $('bg').style.backgroundImage = img; $('bg').classList.add('on'); $('cover').style.opacity = 1; };
    if (first) set(); else { $('cover').style.opacity = 0; setTimeout(set, 150); }
  }
  const st = S.paused ? 'play' : 'pause';
  if (st !== playState) { const f = playState === null; playState = st; $('play').innerHTML = IC[st]; if (!f) $('play').firstChild.classList.add('pop'); }
  $('cur').textContent = fmt(S.cur); $('dur').textContent = fmt(S.dur);
  const pct = S.dur ? Math.min(100, S.cur / S.dur * 100) : 0;
  setP($('pbar'), pct);
  if (!seeking) { $('seek').value = pct * 10; setP($('seek'), pct); }
}
window.api.onMiniState(st => { S = Object.assign(S, st); paint(); });
window.api.miniReady();

$('play').onclick = () => { const b = $('play'); b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce'); window.api.miniCmd('toggle'); };
$('play').addEventListener('animationend', e => { if (e.animationName === 'bounce') $('play').classList.remove('bounce'); });
$('prev').onclick = () => window.api.miniCmd('prev');
$('next').onclick = () => window.api.miniCmd('next');
$('open').onclick = () => window.api.miniExpand();
$('lay').onclick = () => setLayout(layout === 'card' ? 'bar' : 'card', true);
$('seek').onpointerdown = () => { seeking = true; };
$('seek').oninput = e => { setP(e.target, e.target.value / 10); window.api.miniCmd('seek', e.target.value / 1000); };
$('seek').onchange = () => { seeking = false; };
document.addEventListener('pointerup', () => { seeking = false; });

// drag the window from anywhere on the card; double-click it to go back to the full app
let down = null;
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('button,input')) return;
  down = { x: e.screenX, y: e.screenY, moved: false }; document.body.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.screenX - down.x, dy = e.screenY - down.y;
  if (!down.moved) { if (Math.abs(dx) + Math.abs(dy) < 4) return; down.moved = true; window.api.miniDragStart(); }
  window.api.miniDrag(dx, dy);
});
const endDrag = () => { if (down && down.moved) window.api.miniDragEnd(); down = null; };
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
document.addEventListener('dblclick', e => { if (!e.target.closest('button,input')) window.api.miniExpand(); });
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); window.api.miniCmd('toggle'); } else if (e.key === 'Escape') window.api.miniExpand(); });
</script>
</body>
</html>

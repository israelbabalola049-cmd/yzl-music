<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Disc Jockey</title>
<style>
  :root { --bg:#0b0e15; --side:#080b10; --text:#e9ebf1; --muted:#7d8598; --accent:#4a0e22; --accent2:#b13e5c; --line:#1c212c; --border:#ffffff12; --r:18px; --gap:10px; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:"Segoe UI",sans-serif; overflow:hidden; user-select:none; }
  button { font-family:inherit; }
  .dragbar { position:fixed; top:0; left:0; right:140px; height:36px; z-index:1; -webkit-app-region:drag; }
  button, input, select, textarea, a, .row, .deck, .modalbg { -webkit-app-region:no-drag; }
  .app { flex:1; min-height:0; display:grid; grid-template-columns:340px 1fr; gap:var(--gap); padding:var(--gap) var(--gap) 0; }
  .side, .main { border:1px solid var(--border); border-bottom:0; border-radius:var(--r) var(--r) 0 0; min-height:0; min-width:0; }
  .side { background:var(--side); padding:16px 14px; display:flex; flex-direction:column; gap:12px; }
  .main { background:linear-gradient(180deg,#15111c 0,var(--bg) 300px); padding:8px 26px 22px; overflow-y:auto; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; }
  .logo { width:30px; height:30px; border-radius:10px; background:conic-gradient(from 0deg,#2a1420,#b13e5c,#2a1420,#4a0e22,#2a1420); position:relative; } .logo::after { content:''; position:absolute; inset:11px; border-radius:50%; background:var(--side); }
  .head { display:flex; align-items:center; justify-content:space-between; padding-top:26px; margin-bottom:18px; } .head h1 { margin:0; font-size:30px; }
  .muted { color:var(--muted); font-size:13px; }
  .btn { white-space:nowrap; background:var(--accent); color:#fff; border:0; padding:9px 18px; border-radius:12px; font-weight:700; cursor:pointer; font-size:13px; }
  .btn:hover { filter:brightness(1.12); }
  .btn.ghost { background:none; color:var(--text); border:1px solid #3a4254; } .btn.ghost:hover { border-color:var(--text); }
  .btn.sm { padding:6px 12px; font-size:12px; border-radius:10px; }
  .seg { display:flex; background:#070a0f; border-radius:12px; padding:3px; gap:2px; }
  .segbtn { flex:1; border:0; background:none; color:var(--muted); padding:8px 0; border-radius:9px; cursor:pointer; font-weight:700; font-size:12.5px; } .segbtn.on { background:var(--accent); color:#fff; }
  input.in { width:100%; padding:10px 14px; border-radius:12px; border:1px solid #3a4254; background:#070a0f; color:var(--text); font-size:13px; outline:none; user-select:text; } input.in:focus { border-color:var(--accent2); }
  .list { flex:1; min-height:0; overflow-y:auto; margin:0 -6px; padding:0 6px; }
  .row { display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:12px; } .row:hover { background:#ffffff0d; }
  .row > div:first-child { flex:1; min-width:0; } .row.cur { background:#ffffff0d; } .row.cur .t { color:var(--accent2); }
  .t { font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .a { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  h2 { font-size:14px; margin:6px 0 4px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .stage { display:grid; grid-template-columns:1fr 210px 1fr; gap:14px; align-items:stretch; }
  .card { background:#ffffff08; border:1px solid var(--border); border-radius:var(--r); padding:18px; min-width:0; }
  .kind { font-size:11.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--accent2); font-weight:800; }
  .deck.playing { border-color:#b13e5c66; box-shadow:0 0 30px #4a0e2233; }
  .dbody { display:flex; gap:16px; } .dmain { flex:1; min-width:0; } .meter { width:18px; flex:none; align-self:stretch; border-radius:6px; }
  .dtop { display:flex; gap:14px; align-items:center; margin-top:10px; }
  .plat { width:84px; height:84px; flex:none; border-radius:50%; background:conic-gradient(from 0deg,#2a1420,#4a0e22,#2a1420,#b13e5c,#2a1420); border:4px solid #1c212c; position:relative; animation:spin 2s linear infinite; animation-play-state:paused; }
  .plat::after { content:''; position:absolute; inset:36%; border-radius:50%; background:var(--bg); }
  .deck.playing .plat { animation-play-state:running; } @keyframes spin { to { transform:rotate(360deg); } }
  .dt { font-size:17px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bpm { display:inline-block; margin-top:4px; font-size:11.5px; font-weight:700; color:var(--accent2); }
  .dbtns { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .btn.on { border-color:var(--accent2); color:var(--accent2); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .chip { background:#ffffff0d; border:1px solid var(--border); border-radius:8px; padding:3px 8px; font-size:11.5px; font-weight:700; } .chip i { font-style:normal; color:var(--muted); margin-right:5px; font-weight:600; }
  .styles { display:grid; grid-template-columns:1fr 1fr; gap:4px; width:100%; } .styles .segbtn { background:#070a0f; font-size:11.5px; padding:7px 0; } .styles .segbtn.on { background:var(--accent); }
  .match { width:100%; font-size:11.5px; font-weight:700; text-align:center; color:var(--muted); line-height:1.6; } .match b { color:var(--accent2); }
  .seekrow { display:flex; align-items:center; gap:8px; margin-top:14px; font-size:11.5px; color:var(--muted); } .seekrow input { flex:1; }
  .k { display:grid; grid-template-columns:50px 1fr; gap:10px; align-items:center; margin-top:12px; font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  input[type=range] { -webkit-appearance:none; appearance:none; height:5px; border-radius:3px; outline:none; cursor:pointer; background:linear-gradient(to right,var(--accent2) var(--p,0%),#262c3a var(--p,0%)); width:100%; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff; }
  .mixer { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .mixer .btn { width:100%; } .mixer .seg { width:100%; } .mixer .k { width:100%; grid-template-columns:48px 1fr; margin-top:2px; }
  .mrow { display:flex; gap:8px; height:130px; } .mrow .meter { width:20px; }
  .xl { width:100%; display:flex; justify-content:space-between; font-size:11px; color:var(--muted); font-weight:700; margin-top:-6px; }
  .sbtns { display:flex; gap:8px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--accent); padding:9px 18px; border-radius:12px; font-weight:600; font-size:13px; z-index:9; }
  ::-webkit-scrollbar { width:9px; } ::-webkit-scrollbar-thumb { background:#232a38; border-radius:5px; }

  /* polish pass (same feel as the main player) */
  .row, .segbtn, .chip { transition:background-color .15s ease, color .15s ease, border-color .15s ease; }
  .btn { transition:filter .15s ease, border-color .15s ease, color .15s ease, transform .1s ease; }
  .btn:active { transform:scale(.97); }
  button:focus-visible { outline:2px solid var(--accent2); outline-offset:2px; }
  input[type=range]:focus-visible { outline:2px solid var(--accent2); outline-offset:5px; }
  @keyframes toastIn { from { opacity:0; transform:translate(-50%,8px); } to { opacity:1; transform:translate(-50%,0); } }
  @keyframes toastOut { to { opacity:0; transform:translate(-50%,8px); } }
  .toast { animation:toastIn .2s ease-out, toastOut .25s ease-in 1.55s forwards; }

<body>
<div class="dragbar"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"></div>Disc Jockey</div>

      <div class="card mixer">

        <input type="range" id="xfade" min="0" max="100" value="0"><div class="xl"><span>A</span><span>CROSSFADER</span><span>B</span></div>

        <div class="match" id="match"></div>
        <div class="k"><span>Echo</span><input type="range" id="echo" min="0" max="100" value="0"></div>
        <div class="k"><span>Reverb</span><input type="range" id="rev" min="0" max="100" value="0"></div>
      </div>
      <div class="card deck" id="d1"></div>
    </div>
  </section>
</div>
<script>

let songs = [], byPath = new Map(), sets = ld('djSets', []), setlist = ld('djCurrent', []), xf = 5, x = 0, bpm = {}, auto = false, pos = -1, mixing = null, prep = false, tab = 'lib', query = '', plan = null, style = 'auto', an = {};

  const cv = $(id); if (!cv) return; const g = cv.getContext('2d'), w = cv.width, h = cv.height, n = 18, sh = h / n;
  g.clearRect(0, 0, w, h);
  for (let i = 0; i < n; i++) { g.fillStyle = (i + 1) / n <= v ? (i >= n - 2 ? '#ef4444' : i >= n - 6 ? '#f59e0b' : '#22c55e') : '#ffffff12'; g.fillRect(0, h - (i + 1) * sh + 1, w, sh - 2); }
}
function meters() {
  if (ch) { paint('m0', level(ch[0].an, 'a')); paint('m1', level(ch[1].an, 'b')); paint('mL', level(anL, 'l')); paint('mR', level(anR, 'r')); }
  requestAnimationFrame(meters);
}

// rough tempo + key guess from the song itself (tempo: energy bumps; key: note energy matched against major/minor shapes)
async function analyze(s) {
  if (s.path in an) return an[s.path];
  let r = 0, pc = -1, minor = false;
  try {
    const ab = await (await fetch(s.url)).arrayBuffer();
    const b = await new OfflineAudioContext(1, 44100, 44100).decodeAudioData(ab);
    const d = b.getChannelData(0), hop = Math.floor(b.sampleRate / 100), n = Math.min(Math.floor(d.length / hop), 6000), o = new Float32Array(n);
    let pv = 0; for (let i = 0; i < n; i++) { let a = 0; for (let j = 0; j < hop; j += 4) a += Math.abs(d[i * hop + j]); o[i] = Math.max(0, a - pv); pv = a; }
    let best = 0, bl = 0; for (let l = 33; l <= 86; l++) { let c = 0; for (let i = l; i < n; i++) c += o[i] * o[i - l]; if (c > best) { best = c; bl = l; } }
    r = bl ? 6000 / bl : 0; while (r && r < 80) r *= 2; while (r > 165) r /= 2;
    const sr = b.sampleRate, N = 8192, F = 14, st0 = Math.floor(d.length * 0.2), stp = Math.max(1, Math.floor((d.length * 0.6 - N) / F)), han = new Float32Array(N), cr = new Float64Array(12);
    for (let i = 0; i < N; i++) han[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
    for (let f = 0; f < F; f++) { const off = st0 + f * stp; if (off + N > d.length) break;
      for (let m = 36; m < 96; m++) { const co = 2 * Math.cos(2 * Math.PI * 440 * Math.pow(2, (m - 69) / 12) / sr); let s1 = 0, s2 = 0;
        for (let i = 0; i < N; i++) { const s0 = d[off + i] * han[i] + co * s1 - s2; s2 = s1; s1 = s0; }
        cr[m % 12] += Math.sqrt(Math.max(0, s1 * s1 + s2 * s2 - co * s1 * s2)); } }
    const cor = (t, pr) => { let ma = 0, mp = 0; for (let i = 0; i < 12; i++) { ma += cr[(t + i) % 12]; mp += pr[i]; } ma /= 12; mp /= 12; let sa = 0, sb = 0, sab = 0;
      for (let i = 0; i < 12; i++) { const u = cr[(t + i) % 12] - ma, v = pr[i] - mp; sab += u * v; sa += u * u; sb += v * v; } return sab / Math.sqrt(sa * sb || 1); };
    let bc = -2; for (let t = 0; t < 12; t++) for (const mi of [0, 1]) { const c = cor(t, mi ? MINP : MAJP); if (c > bc) { bc = c; pc = t; minor = !!mi; } }
  } catch {}
  bpm[s.path] = r; return an[s.path] = { pc, minor };
}
const bpmOf = async s => { await analyze(s); return bpm[s.path]; };
// what key a deck actually sounds in right now (speed moves the key unless key lock is on)
function eff(d) {
  const s = song[d], a = s && an[s.path]; if (!a || a.pc < 0) return null;
  const sh = lock[d] ? 0 : Math.round(12 * Math.log2(A[d].playbackRate)), pc = ((a.pc + sh) % 12 + 12) % 12;
  return { minor: a.minor, cam: (a.minor ? MINC : MAJC)[pc], name: NOTES[pc] + (a.minor ? 'm' : '') };
}
function keyFit() {
  const a = eff(0), b = eff(1); if (!a || !b) return -1;
  if (a.cam === b.cam) return 2;
  return Math.min((a.cam - b.cam + 12) % 12, (b.cam - a.cam + 12) % 12) === 1 && a.minor === b.minor ? 1 : 0;
}
function updateChips(d) {
  const el = $('ch' + d), s = song[d];
  if (el) { if (!s) el.innerHTML = ''; else { const R = A[d].playbackRate, bb = bpm[s.path], k = eff(d);
    el.innerHTML = `<span class="chip"><i>Speed</i>${R >= 1 ? '+' : ''}${((R - 1) * 100).toFixed(1)}%</span><span class="chip"><i>BPM</i>${bb ? (bb * R).toFixed(1) : '...'}</span><span class="chip"><i>Key</i>${k ? k.cam + (k.minor ? 'A' : 'B') + ' • ' + k.name : '...'}</span>`; } }
  const m = $('match'); if (!m) return;
  const b0 = song[0] && bpm[song[0].path] * A[0].playbackRate, b1 = song[1] && bpm[song[1].path] * A[1].playbackRate, f = keyFit();
  m.innerHTML = (b0 && b1 ? (Math.abs(b0 / b1 - 1) < 0.015 ? '<b>Tempo locked</b>' : 'Tempo ' + (Math.abs(b0 / b1 - 1) * 100).toFixed(1) + '% apart') : 'Tempo: load both decks') + '<br>' + (f < 0 ? 'Key: load both decks' : f === 2 ? '<b>Keys match</b>' : f === 1 ? 'Keys are close' : 'Keys clash');
}
async function syncDeck(d, tol = 0.12) {
  const o = 1 - d; if (!song[d] || !song[o]) return false;
  const [a, b] = [await bpmOf(song[o]), await bpmOf(song[d])]; if (!a || !b) return false;
  const q = a * A[o].playbackRate / b, r = [q, q * 2, q / 2].find(k => Math.abs(k - 1) <= tol) || 1;
  A[d].playbackRate = r; drawDeck(d); return r !== 1 || Math.abs(q - 1) < 0.01;
}

/* ---------- decks ---------- */
function drawDeck(d) {
  const s = song[d], b = s && bpm[s.path], R = A[d].playbackRate;
  const k = (key, lab, min, max, step, val) => `<div class="k"><span>${lab}</span><input type="range" data-d="${d}" data-k="${key}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
  $('d' + d).innerHTML = `<div class="kind">Deck ${'AB'[d]}</div>
    <div class="dbody"><div class="dmain">
      <div class="dtop"><div class="plat" style="animation-duration:${(2 / R).toFixed(2)}s"></div><div style="min-width:0"><div class="dt">${s ? esc(s.title) : 'Empty deck'}</div><div class="a">${s ? esc(s.artist) : 'Nothing loaded yet. Grab a song from the library'}</div><div class="chips" id="ch${d}"></div></div></div>
      <div class="dbtns"><button class="btn sm" data-b="play" data-d="${d}">${A[d].paused ? 'Play' : 'Pause'}</button><button class="btn ghost sm" data-b="sync" data-d="${d}">Sync</button><button class="btn ghost sm" data-b="reset" data-d="${d}">Reset speed</button><button class="btn ghost sm${lock[d] ? ' on' : ''}" data-b="lock" data-d="${d}">Key lock</button><button class="btn ghost sm" data-b="half" data-d="${d}">BPM ÷2</button><button class="btn ghost sm" data-b="dbl" data-d="${d}">BPM ×2</button></div>
      <div class="seekrow"><span id="c${d}">0:00</span><input type="range" id="s${d}" min="0" max="100" step="0.1" value="0" data-seek="${d}"><span id="e${d}">0:00</span></div>
      ${k('lo', 'Low', -12, 12, 0.5, kn[d].lo)}${k('mi', 'Mid', -12, 12, 0.5, kn[d].mi)}${k('hi', 'High', -12, 12, 0.5, kn[d].hi)}${k('fl', 'Filter', -100, 100, 1, kn[d].fl)}${k('rate', 'Speed', 0.85, 1.15, 0.005, R)}${k('vol', 'Volume', 0, 1, 0.01, kn[d].vol)}
    </div><canvas class="meter" id="m${d}" width="18" height="300"></canvas></div>`;
  $('d' + d).querySelectorAll('input[type=range]').forEach(setP);
  $('d' + d).classList.toggle('playing', !A[d].paused);
  updateChips(d);
}
async function load(d, s, play) {
  ensure(); const a = A[d]; a.pause(); a.src = s.url; a.playbackRate = 1; a.preservesPitch = a.webkitPreservesPitch = lock[d]; song[d] = s; drawDeck(d);
  if (play) a.play().catch(() => {}).then(() => drawDeck(d));
  bpmOf(s).then(() => { if (song[d] === s) drawDeck(d); });
}
function endMix(o, d) {
  const t = ctx.currentTime; A[o].pause(); A[o].playbackRate = 1; A[o].preservesPitch = A[o].webkitPreservesPitch = lock[o];
  [o, d].forEach(i => { ['lo', 'mi', 'hi'].forEach(k => ch[i][k].gain.setTargetAtTime(kn[i][k], t, 0.05)); knob(i, 'fl', kn[i].fl); });
  ch[o].es.gain.setTargetAtTime(0, t, 0.05); mixing = null; drawDeck(0); drawDeck(1);
}
function mixTo(d, secs = xf, st = 'fade', now = false) {
  ensure(); const o = 1 - d; if (!song[d]) { toast('Nothing on the other deck yet, load something first'); return; }
  if (st === 'cut' && !now) {   // land the cut on the next bar of the song that's playing
    const bb = bpm[song[o].path] * A[o].playbackRate, bar = bb ? 240 / bb : 0;
    if (bar) { setTimeout(() => mixTo(d, 0.3, 'cut', true), (bar - (A[o].currentTime % bar)) / A[o].playbackRate * 1000); return; }
  }
  clearInterval(mixing); const t0 = performance.now(), from = x, to = d ? 1 : 0, Ro = A[o].playbackRate, t = ctx.currentTime; let swapped = false, started = false;
  if (st !== 'cut' && st !== 'brake' && A[d].paused) A[d].play().catch(() => {});
  if (st === 'bass') ch[d].lo.gain.setTargetAtTime(-24, t, 0.03);
  if (st === 'echo') ch[o].es.gain.setTargetAtTime(0.9, t, 0.05);
  if (st === 'filter') { ch[o].fl.type = 'lowpass'; ch[d].fl.type = 'highpass'; ch[d].fl.frequency.value = 1500; }
  if (st === 'brake') A[o].preservesPitch = A[o].webkitPreservesPitch = false;
  mixing = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / (secs * 1000)), tt = ctx.currentTime; let xk = k;
    if (st === 'echo') xk = Math.min(1, k / 0.3);
    if (st === 'filter') { ch[o].fl.frequency.value = 22000 * Math.pow(200 / 22000, Math.min(1, k / 0.8)); ch[d].fl.frequency.value = 20 * Math.pow(75, 1 - k); }
    if (st === 'bass' && k >= 0.5 && !swapped) { swapped = true; ch[o].lo.gain.setTargetAtTime(-24, tt, 0.05); ch[d].lo.gain.setTargetAtTime(kn[d].lo, tt, 0.05); }
    if (st === 'brake') { xk = k < 0.7 ? 0 : Math.min(1, (k - 0.7) / 0.1); A[o].playbackRate = Math.max(0.06, Ro * Math.pow(1 - Math.min(k / 0.85, 1), 1.5)); if (k >= 0.7 && !started) { started = true; A[d].play().catch(() => {}); } }
    if (st === 'cut') { xk = k < 0.5 ? 0 : 1; if (k >= 0.5 && !started) { started = true; A[d].play().catch(() => {}); } }
    x = from + (to - from) * xk; cross();
    if (k >= 1) { clearInterval(mixing); endMix(o, d); }
  }, 30);
}
// picks the move for you: similar tempo + keys = long bass swap, far apart = echo out
async function planMix(a, o) {
  if (style !== 'auto') return { d: o, st: style, secs: style === 'cut' ? 0.3 : style === 'brake' ? 2.5 : xf };
  await Promise.all([analyze(song[a]), analyze(song[o])]);
  const b1 = bpm[song[a].path] * A[a].playbackRate, b2 = bpm[song[o].path] * A[o].playbackRate, diff = b1 && b2 ? Math.abs(b1 / b2 - 1) : 1, fit = keyFit();
  if (diff < 0.04) return fit >= 1 ? { d: o, st: 'bass', secs: 14 } : { d: o, st: 'fade', secs: 8 };
  return diff < 0.12 ? { d: o, st: 'filter', secs: 8 } : { d: o, st: 'echo', secs: 6 };
}
async function doMix() {
  const a = x < 0.5 ? 0 : 1, o = 1 - a; if (!song[o]) { toast('Nothing on the other deck yet, load something first'); return; }
  if (style === 'auto') await syncDeck(o, 0.08);
  const pl = await planMix(a, o); toast('Mixing: ' + STY[pl.st]); mixTo(pl.d, pl.secs, pl.st);
}

/* ---------- set (auto DJ) ---------- */
async function prepNext(act) {
  prep = true; const o = 1 - act, next = byPath.get(setlist[pos + 1]);
  if (next) { await load(o, next, false); await Promise.all([analyze(song[act]), analyze(next)]); if (style === 'auto') await syncDeck(o, 0.08); plan = await planMix(act, o); }
  prep = false;
}
function playSet() {
  const first = byPath.get(setlist[0]); if (!first) { toast('Add a few songs to the set first'); return; }
  pos = 0; x = 0; plan = null; cross(); load(0, first, true); auto = true; drawPane();
}
setInterval(() => {
  [0, 1].forEach(d => {
    const a = A[d]; if (!$('s' + d)) return;
    $('c' + d).textContent = fmt(a.currentTime); $('e' + d).textContent = fmt(a.duration);
    if (a.duration && document.activeElement !== $('s' + d)) { $('s' + d).value = a.currentTime / a.duration * 100; setP($('s' + d)); }
    $('d' + d).classList.toggle('playing', !a.paused);
  });
  if (auto && !mixing && !prep) {
    const act = x < 0.5 ? 0 : 1, a = A[act], rem = a.duration - a.currentTime;
    if (a.duration) {
      if (!plan && pos + 1 < setlist.length && rem <= 35) prepNext(act);
      else if (plan && rem <= plan.secs + (plan.st === 'cut' ? 9 : 0.5)) { const pl = plan; plan = null; pos++; mixTo(pl.d, pl.secs, pl.st); drawPane(); }
      else if (pos + 1 >= setlist.length && a.ended) auto = false;
    }
  }
}, 250);

/* ---------- side panel: library + set ---------- */
function drawTabs() { $('tabs').innerHTML = `<button class="segbtn${tab === 'lib' ? ' on' : ''}" data-tab="lib">Library</button><button class="segbtn${tab === 'set' ? ' on' : ''}" data-tab="set">Set (${setlist.length})</button>`; }
function libRows() {
  const q = query.trim().toLowerCase();
  const res = (q ? songs.filter(s => (s.title + ' ' + s.artist).toLowerCase().includes(q)) : songs).slice(0, 80);
  return res.map(s => `<div class="row" data-p="${encodeURIComponent(s.path)}"><div><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div><button class="btn ghost sm" data-l="0">A</button><button class="btn ghost sm" data-l="1">B</button><button class="btn ghost sm" data-l="add">+</button></div>`).join('') || '<div class="muted" style="padding:8px">Couldn\'t find that one.</div>';
}
function drawPane() {
  sv('djCurrent', setlist); drawTabs();
  if (tab === 'lib') {
    $('pane').innerHTML = `<input class="in" id="q" placeholder="Search songs or artists" value="${esc(query)}"><div class="list" id="lib">${songs.length ? libRows() : '<div class="muted" style="padding:8px">No library yet. Pick your music folder in YZL Music first, then come back.</div>'}</div>`;
    $('q').oninput = e => { query = e.target.value; $('lib').innerHTML = libRows(); };
  } else {
    $('pane').innerHTML = `<div class="sbtns"><button class="btn sm" id="playSet">Play set</button><button class="btn ghost sm" id="stopSet">Stop</button><button class="btn ghost sm" id="clearSet">Clear</button></div>
      <div class="list" style="flex:none;max-height:210px">${setlist.map((p, i) => { const s = byPath.get(p); return s ? `<div class="row${auto && i === pos ? ' cur' : ''}"><div><div class="t">${i + 1}. ${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div><button class="btn ghost sm" data-rm="${i}">✕</button></div>` : ''; }).join('') || '<div class="muted" style="padding:8px">Nothing in the set yet. Hit + on songs in the Library to build it.</div>'}</div>
      <div style="display:flex;gap:8px"><input class="in" id="setName" placeholder="Name this set"><button class="btn sm" id="saveSet">Save</button></div>
      <h2>Saved sets</h2><div class="list">${sets.map(v => `<div class="row"><div><div class="t">${esc(v.name)}</div><div class="a">${v.songs.length} songs • ${v.xfade}s fades</div></div><button class="btn sm" data-ld="${v.id}">Load</button><button class="btn ghost sm" data-del="${v.id}">✕</button></div>`).join('') || '<div class="muted" style="padding:8px">No saved sets yet. Build one and save it.</div>'}</div>`;
  }
}
function drawStyles() { $('styles').innerHTML = Object.entries(STY).map(([k, v]) => `<button class="segbtn${style === k ? ' on' : ''}" data-st="${k}">${v}</button>`).join(''); }
function drawSeg() { $('xfSeg').innerHTML = [3, 5, 8, 12].map(v => `<button class="segbtn${xf === v ? ' on' : ''}" data-xf="${v}">${v}s</button>`).join(''); }

/* ---------- events ---------- */
document.addEventListener('input', e => {
  const r = e.target; if (r.tagName !== 'INPUT' || r.type !== 'range') return; setP(r);
  if (r.dataset.seek != null) { const a = A[+r.dataset.seek]; if (a.duration) a.currentTime = r.value / 100 * a.duration; return; }
  if (r.id === 'xfade') { clearInterval(mixing); mixing = null; ensure(); x = r.value / 100; cross(); return; }
  if (r.id === 'echo') { ensure(); echoG.gain.setTargetAtTime(r.value / 100 * 0.8, ctx.currentTime, 0.03); return; }
  if (r.id === 'rev') { ensure(); revG.gain.setTargetAtTime(Math.pow(r.value / 100, 1.3) * 1.1, ctx.currentTime, 0.03); return; }
  if (r.dataset.k === 'rate') { A[+r.dataset.d].playbackRate = +r.value; updateChips(+r.dataset.d); return; }
  if (r.dataset.k) knob(+r.dataset.d, r.dataset.k, +r.value);
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'back') { window.api.switchMode('main'); return; }
  if (b.dataset.tab) { tab = b.dataset.tab; drawPane(); return; }
  if (b.id === 'mix') { doMix(); return; }
  if (b.dataset.st) { style = b.dataset.st; drawStyles(); return; }
  if (b.dataset.xf) { xf = +b.dataset.xf; drawSeg(); return; }
  if (b.dataset.b) {
    const d = +b.dataset.d; ensure();
    if (b.dataset.b === 'play') { if (A[d].paused) await A[d].play().catch(() => {}); else A[d].pause(); drawDeck(d); }
    if (b.dataset.b === 'reset') { A[d].playbackRate = 1; drawDeck(d); }
    if (b.dataset.b === 'lock') { lock[d] = !lock[d]; A[d].preservesPitch = A[d].webkitPreservesPitch = lock[d]; drawDeck(d); }
    if (b.dataset.b === 'half' || b.dataset.b === 'dbl') { const sg = song[d]; if (sg && bpm[sg.path]) { bpm[sg.path] *= b.dataset.b === 'half' ? 0.5 : 2; drawDeck(d); updateChips(1 - d); } }
    if (b.dataset.b === 'sync') { const ok = await syncDeck(d); toast(ok ? 'Synced' : 'Couldn\'t lock onto the tempo on that one'); }
    return;
  }
  const row = b.closest('.row[data-p]');
  if (row && b.dataset.l != null) {
    const s = byPath.get(decodeURIComponent(row.dataset.p));
    if (b.dataset.l === 'add') { setlist.push(s.path); drawTabs(); sv('djCurrent', setlist); toast('Added to set'); } else { auto = false; load(+b.dataset.l, s, false); }
    return;
  }
  if (b.dataset.rm != null) { setlist.splice(+b.dataset.rm, 1); drawPane(); return; }
  if (b.id === 'playSet') { playSet(); return; }
  if (b.id === 'stopSet') { auto = false; A.forEach(a => a.pause()); drawDeck(0); drawDeck(1); drawPane(); return; }
  if (b.id === 'clearSet') { setlist = []; auto = false; drawPane(); return; }
  if (b.id === 'saveSet') {
    const name = $('setName').value.trim(); if (!name || !setlist.length) { toast('Give it a name and add some songs first'); return; }
    sets.push({ id: Date.now().toString(36), name, xfade: xf, songs: setlist.slice() }); sv('djSets', sets); drawPane(); toast('Set saved'); return;
  }
  if (b.dataset.ld) { const v = sets.find(z => z.id === b.dataset.ld); if (v) { setlist = v.songs.slice(); xf = v.xfade; drawSeg(); drawPane(); toast('Set loaded, hit Play set when you\'re ready'); } return; }
  if (b.dataset.del) { sets = sets.filter(z => z.id !== b.dataset.del); sv('djSets', sets); drawPane(); }
});

/* ---------- start ---------- */
drawDeck(0); drawDeck(1); drawSeg(); drawStyles(); drawPane(); cross();
window.api.loadSaved().then(d => {
  if (!d) return;
  const ov = ld('overrides', {});
  songs = d.songs.map(s => { const o = ov[s.path] || {}; return { ...s, title: o.title || s.title, artist: o.artist || s.artist }; });
  byPath = new Map(songs.map(s => [s.path, s])); drawPane();
});
</script>
</body>

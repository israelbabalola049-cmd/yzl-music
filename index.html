<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YZL Music</title>
<style>
  @property --tint { syntax:'<color>'; inherits:true; initial-value:#0b0e15; }
  @property --tacc { syntax:'<color>'; inherits:true; initial-value:#b13e5c; }
  @property --btn { syntax:'<color>'; inherits:true; initial-value:#55112a; }
  html { transition:--tint 1.1s ease, --tacc 1.1s ease, --btn 1.1s ease; }
  @media (prefers-reduced-motion:reduce) { html { transition:none; } }
  :root { --bg:var(--tint); --side:color-mix(in srgb, var(--tint) 72%, #000); --panel:color-mix(in srgb, var(--tint) 98.5%, #fff); --text:#e9ebf1; --muted:#7d8598; --accent:#4a0e22; --accent2:var(--tacc); --line:#1c212c; --border:#ffffff12; --r:18px; --gap:10px; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font-family:"Segoe UI",sans-serif; overflow:hidden; user-select:none; }
  button { font-family:inherit; }
  .dragbar { position:fixed; top:0; left:0; right:140px; height:36px; z-index:1; -webkit-app-region:drag; }
  button, input, select, textarea, a, .nav, .row, .modalbg, .menu, .cspop { -webkit-app-region:no-drag; }

  /* ---------- layout ---------- */
  .app { flex:1; min-height:0; display:grid; grid-template-columns:calc(250px + var(--gap)) 1fr 0px; transition:grid-template-columns .35s ease; padding:var(--gap) var(--gap) 0; }
  .app.showRight { grid-template-columns:calc(250px + var(--gap)) 1fr calc(290px + var(--gap)); }

  /* ---------- left sidebar ---------- */
  .side { background:var(--side); border:1px solid var(--border); border-bottom:0; border-radius:var(--r) var(--r) 0 0; margin-right:var(--gap); padding:14px 12px 16px; display:flex; flex-direction:column; gap:4px; overflow:hidden; }
  .brand { font-size:17px; font-weight:800; padding:2px 12px 18px; display:flex; align-items:center; gap:10px; }
  .backbtn { width:32px; height:32px; flex:none; border:0; border-radius:8px; background:#ffffff12; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .backbtn:hover:not(:disabled) { background:#ffffff22; } .backbtn:disabled { opacity:.35; cursor:default; }
  .backbtn svg { width:18px; height:18px; }
  .brand .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#6a1730,#2e0816); display:flex; align-items:center; justify-content:center; color:#fff; }
  .nav { display:flex; align-items:center; gap:14px; width:100%; padding:11px 12px; border:0; border-radius:10px; background:none;
         color:var(--muted); font-size:14.5px; font-weight:600; cursor:pointer; text-align:left; }
  .nav:hover { color:var(--text); background:#ffffff0a; }
  .nav.active { color:var(--text); background:#ffffff14; }
  .nav.active svg { color:var(--accent2); }
  .spacer { flex:1; }
  .folderbtn { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px dashed #262c3b; border-radius:10px; background:none; color:var(--muted); cursor:pointer; font-size:13px; }
  .folderbtn:hover { color:var(--text); border-color:var(--accent2); }

  /* ---------- center ---------- */
  .content { overflow-y:auto; padding:8px 30px 30px; background:linear-gradient(180deg,color-mix(in srgb, var(--tacc) 6%, var(--bg)) 0,var(--bg) 300px); min-width:0; border:1px solid var(--border); border-bottom:0; border-radius:var(--r) var(--r) 0 0; }
  /* home: the welcome card sits alone on top, the usual middle box starts underneath it */
  .content.ishome { background:none; border:0; border-radius:0; padding:0; display:flex; flex-direction:column; }
  .homebox { flex:1 0 auto; padding:6px 30px 30px; background:linear-gradient(180deg,color-mix(in srgb, var(--tacc) 6%, var(--bg)) 0,var(--bg) 300px); border:1px solid var(--border); border-bottom:0; border-radius:var(--r) var(--r) 0 0; }
  .homebox > .featlbl { padding-top:22px; }
  h1 { font-size:30px; margin:4px 0 6px; }
  h2 { font-size:19px; margin:30px 0 14px; }
  .muted { color:var(--muted); font-size:13.5px; }
  .head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px; }
  .searchbox { display:flex; align-items:center; gap:10px; background:#ffffff12; padding:9px 16px; border-radius:12px; width:320px; color:var(--muted); }
  .searchbox input { flex:1; background:none; border:0; outline:none; color:var(--text); font-size:14px; user-select:text; min-width:0; }
  .btn { white-space:nowrap; flex:none; background:var(--accent); color:#fff; border:0; padding:11px 22px; border-radius:12px; font-weight:700; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; gap:8px; }
  .btn:hover { filter:brightness(1.1); }
  .btn.ghost { background:none; color:var(--text); border:1px solid #3a4254; }
  .btn.ghost:hover { border-color:var(--text); }
  .btn.danger:hover { color:#ff6b6b; border-color:#ff6b6b; }
  .btns { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .empty { text-align:center; color:var(--muted); margin:80px auto; max-width:360px; line-height:1.6; }
  .empty .btn { margin-top:18px; }

  /* covers */
  .cover { position:relative; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center;
           color:#ffffffaa; font-size:20px; flex:none; border-radius:6px; overflow:hidden; }
  .cover.has span { display:none; }

  /* song rows */
  .colhead, .row { display:grid; grid-template-columns:36px 44px minmax(0,1.5fr) minmax(0,1fr) 40px; gap:12px; align-items:center; padding:6px 10px; }
  .colhead { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:6px; }
  .row { border-radius:8px; cursor:pointer; }
  .row:hover { background:#ffffff0d; }
  .row.active { background:#ffffff14; }
  .row .cover { width:44px; height:44px; }
  .num { text-align:center; color:var(--muted); font-size:13px; }
  .eq { display:none; gap:2px; align-items:flex-end; height:14px; justify-content:center; }
  .eq i { width:3px; height:100%; background:var(--accent2); transform-origin:bottom; animation:eq 1s infinite ease-in-out; }
  .eq i:nth-child(2) { animation-delay:.2s; } .eq i:nth-child(3) { animation-delay:.4s; }
  @keyframes eq { 0%,100% { transform:scaleY(.3); } 50% { transform:scaleY(1); } }
  body.paused .eq i { animation-play-state:paused; }
  .row.active .n { display:none; } .row.active .eq { display:flex; }
  .row.active .t { color:var(--accent2); }
  .t { font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .a, .alb { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .act { opacity:0; background:none; border:0; color:var(--muted); cursor:pointer; width:32px; height:32px; padding:0; border-radius:10px; display:flex; align-items:center; justify-content:center; justify-self:center; }
  .row:hover .act { opacity:1; } .act:hover { color:var(--text); background:#ffffff14; }

  /* cards */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:18px; }
  .card { position:relative; background:#ffffff08; padding:14px; border-radius:14px; cursor:pointer; transition:background .2s; min-width:0; }
  .card:hover { background:#ffffff14; }
  .card .cover { width:100%; aspect-ratio:1; font-size:46px; border-radius:10px; margin-bottom:12px; box-shadow:0 8px 20px #0006; }
  .card.round .cover { border-radius:50%; }
  .card .ct { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .cs { color:var(--muted); font-size:12.5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cact { position:absolute; top:22px; right:22px; opacity:0; background:#00000099; border:0; color:#fff; cursor:pointer; width:30px; height:30px; padding:0; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .card:hover .cact { opacity:1; } .cact:hover { background:#000000cc; }

  .albmeta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .typebadge { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; background:#ffffff14; color:var(--muted); padding:3px 9px; border-radius:10px; }


  /* header cards (artist + album pages) */
  .hcard { display:flex; gap:clamp(16px,2.2vw,28px); align-items:center; margin:10px 0 26px; padding:22px; border-radius:16px; background:#ffffff0d center/cover no-repeat; }
  .hav { width:clamp(110px,15vw,200px); height:clamp(110px,15vw,200px); border-radius:50%; flex:none; background:#1d2028 center/cover no-repeat; border:1px solid #ffffff1f;
         display:flex; align-items:center; justify-content:center; color:#ffffffaa; cursor:pointer; transition:filter .15s; }
  .hav:hover { filter:brightness(1.18); }
  .hcard .hcover { width:clamp(110px,15vw,200px); height:clamp(110px,15vw,200px); flex:none; font-size:64px; border-radius:12px; box-shadow:0 12px 30px #0008; }
  .hinfo { min-width:0; flex:1; }
  .hinfo h1 { font-size:clamp(26px,3.4vw,44px); overflow-wrap:anywhere; margin:0 0 8px; line-height:1.1; }
  .hmeta { font-size:16px; }
  .hsub { color:var(--muted); font-size:13.5px; margin-top:10px; }
  .albArtist { cursor:pointer; } .albArtist:hover { text-decoration:underline; }
  .card.albcard .cover { border-radius:8px; }
  /* album track list */
  .tracks { margin-top:8px; }
  .trow { grid-template-columns:44px minmax(0,2fr) minmax(0,1.3fr) 56px 60px 36px; min-width:0; padding:14px 10px; }
  .tracks .trow:nth-child(odd) { background:#ffffff08; }
  .tracks .trow:hover, .tracks .trow.active { background:#ffffff14; }
  .trow .a { color:var(--text); font-size:14px; }

  /* detail header */
  .dhead { display:flex; gap:26px; align-items:flex-end; padding-top:10px; margin-bottom:24px; }
  .dhead .cover { width:180px; height:180px; font-size:64px; border-radius:12px; box-shadow:0 12px 30px #0008; }
  .dhead.round .cover { border-radius:50%; }
  .dhead .kind { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:700; }
  .dhead h1 { font-size:44px; margin:4px 0; }

  .album { margin-bottom:10px; }
  .alhead { display:flex; align-items:center; gap:16px; margin:28px 0 10px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .alhead .cover { width:76px; height:76px; border-radius:10px; font-size:28px; }
  .alhead > div { flex:1; min-width:0; }
  .alhead .kind { font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--accent2); font-weight:700; }
  .aln { font-size:20px; font-weight:800; margin:2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hinfo .btns, .dhead .btns { gap:8px; margin-top:12px; }
  .hinfo .btns .btn, .dhead .btns .btn { padding:7px 12px; font-size:12.5px; gap:6px; border-radius:10px; }
  .hinfo .btns .btn svg, .dhead .btns .btn svg { width:14px; height:14px; }
  /* sidebar playlists */
  .plhead { display:flex; align-items:center; justify-content:space-between; padding:16px 12px 8px; font-size:15px; font-weight:800; }
  .plplus { background:none; border:0; color:var(--muted); font-size:22px; line-height:1; cursor:pointer; padding:0 4px; border-radius:6px; }
  .plplus:hover { color:var(--text); }
  .pllist { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:2px; margin:0 -6px; padding:0 6px; }
  .plitem { display:flex; align-items:center; gap:12px; padding:6px 8px; border-radius:10px; cursor:pointer; }
  .plitem:hover { background:#ffffff0a; } .plitem.active { background:#ffffff14; }
  .plitem .cover { width:42px; height:42px; flex:none; border-radius:6px; font-size:16px; }
  .plitem .cover span svg { width:18px; height:18px; }
  .plitem .pn { font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .plitem .pc { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .plitem > div:last-child { min-width:0; }
  .plempty { color:var(--muted); font-size:12.5px; padding:6px 12px; }
  /* queue reordering */
  .qgrip { display:flex; justify-content:center; color:var(--muted); cursor:grab; opacity:.45; }
  .qrow:hover .qgrip { opacity:1; }
  .qrow.dragging { opacity:.35; }
  .qrow.dropB { box-shadow:0 -2px 0 var(--accent2); } .qrow.dropA { box-shadow:0 2px 0 var(--accent2); }
  .btn.small { padding:8px 16px; font-size:13px; }
  .cover.likedcov { background:linear-gradient(135deg,#6a1730,#2a0714); color:#fff; }
  .cover.likedcov span { display:flex; } .cover.likedcov svg { width:44px; height:44px; fill:currentColor; }
  .dhead .cover.likedcov svg { width:72px; height:72px; }
  .plitem .cover.likedcov svg { width:18px; height:18px; }
  .row[data-drag] { cursor:pointer; }
  .row.dragging { opacity:.35; }
  .row.dropB { box-shadow:0 -2px 0 var(--accent2); } .row.dropA { box-shadow:0 2px 0 var(--accent2); }
  .pkbox { margin-top:12px; max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .pk { display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:10px; cursor:pointer; }
  .pk:hover { background:#ffffff0d; }
  .pk > div:first-child { flex:1; min-width:0; }
  .pk .pkb { width:30px; height:30px; flex:none; border-radius:10px; display:flex; align-items:center; justify-content:center; background:#ffffff10; color:var(--muted); }
  .pk.in .pkb { background:var(--accent); color:#fff; }

  /* ---------- right sidebar ---------- */
  .right { overflow:hidden; min-width:0; }
  .right .inner { width:290px; height:100%; margin-left:var(--gap); overflow-y:auto; padding:44px 18px 22px; background:var(--side); border:1px solid var(--border); border-bottom:0; border-radius:var(--r) var(--r) 0 0; }
  .rhead { display:flex; justify-content:space-between; align-items:center; font-weight:700; margin-bottom:16px; }
  .cover.big { width:100%; aspect-ratio:1; font-size:96px; border-radius:14px; box-shadow:0 18px 40px #000a; }
  .rt { font-size:21px; font-weight:800; margin-top:20px; line-height:1.25; word-break:break-word; }
  .ra { color:var(--text); opacity:.85; margin-top:6px; font-size:14.5px; }
  .rb { color:var(--muted); margin-top:3px; font-size:13px; }
  .rsec { margin:26px 0 8px; font-weight:700; font-size:14px; }
  .upn { display:flex; gap:12px; align-items:center; padding:7px; border-radius:8px; cursor:pointer; }
  .upn:hover { background:#ffffff0d; }
  .upn .cover { width:40px; height:40px; font-size:16px; }
  .upn > div:last-child { min-width:0; }

  /* ---------- bottom player ---------- */
  .player { flex:none; height:88px; background:var(--panel); border-top:1px solid var(--line); display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) minmax(0,1fr); align-items:center; padding:0 22px; gap:24px; }
  .mini { display:flex; align-items:center; gap:14px; min-width:0; }
  .mini .cover { width:56px; height:56px; flex:none; border-radius:10px; margin:0; box-shadow:0 4px 14px #0006; }
  .mini > div:last-child { min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; }
  .mini .t { font-size:14px; font-weight:700; line-height:1.25; }
  .mini .a { font-size:12.5px; line-height:1.25; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-center { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; min-width:0; }
  .controls { display:flex; align-items:center; justify-content:center; gap:10px; height:46px; }
  .ic { background:none; border:0; color:var(--muted); cursor:pointer; padding:8px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; position:relative; transition:color .15s, background .15s, transform .25s cubic-bezier(.34,1.56,.64,1); }
  .ic:hover { color:var(--text); }
  .ic.on { color:var(--accent2); }
  .ic.one::after { content:"1"; position:absolute; font-size:9px; font-weight:800; top:9px; right:6px; }
  .controls .ic:not(#play):active { transform:scale(.86); }
  #play { width:46px; height:46px; padding:0; margin:0 6px; color:#fff; border-radius:15px; }
  .seekrow { display:flex; align-items:center; gap:12px; width:100%; max-width:640px; height:16px; }
  .time { flex:none; width:40px; font-size:11.5px; line-height:1; color:var(--muted); font-variant-numeric:tabular-nums; }
  #cur { text-align:right; } #dur { text-align:left; }
  .pl-right { display:flex; align-items:center; justify-content:flex-end; gap:6px; min-width:0; }
  #vol { width:104px; flex:none; margin-left:2px; }
  input[type=range] { -webkit-appearance:none; appearance:none; height:5px; border-radius:3px; outline:none; cursor:pointer; margin:0;
    background:linear-gradient(to right,var(--accent2) var(--p,0%),#262c3a var(--p,0%)); }
  input[type=range]:hover { background:linear-gradient(to right,var(--accent2) var(--p,0%),#262c3a var(--p,0%)); }
  #seek { flex:1; min-width:0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#fff; opacity:0; transition:opacity .15s; }
  input[type=range]:hover::-webkit-slider-thumb { opacity:1; }

  /* ---------- popups ---------- */
  .menu { position:fixed; z-index:50; width:210px; background:#11151e; border:1px solid #262c3b; border-radius:10px; padding:6px; box-shadow:0 12px 30px #000a; max-height:300px; overflow-y:auto; }
  .mi { padding:9px 12px; border-radius:6px; font-size:13.5px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:9px; }
  .editrow { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .editcov { width:64px; height:64px; border-radius:8px; flex:none; background-size:cover; background-position:center; }
  .editfields { display:flex; flex-direction:column; gap:10px; }
  .editfields input { margin-bottom:0; }
  .mi:hover { background:#ffffff14; } .mi.new { color:var(--accent2); font-weight:700; }
  .modalbg { position:fixed; inset:0; background:#000a; z-index:60; display:flex; align-items:center; justify-content:center; }
  .modal { background:#0e121a; border:1px solid #262c3b; padding:24px; border-radius:16px; width:360px; }
  .modal h3 { margin:0 0 14px; }
  .modal input { width:100%; padding:11px 14px; border-radius:10px; border:1px solid #3a4254; background:#070a0f; color:var(--text); font-size:15px; outline:none; user-select:text; }
  .modal input:focus { border-color:var(--accent2); }
  .modal .btns { justify-content:flex-end; }
  .toast { position:fixed; bottom:108px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:10px 20px; border-radius:12px; font-weight:600; font-size:13.5px; z-index:70; }

  .mdiv { height:1px; background:#262c3b; margin:5px 4px; }
  .rsec { display:flex; justify-content:space-between; align-items:baseline; }
  .rsec a { font-size:12px; color:var(--accent2); cursor:pointer; font-weight:600; }
  .qrow { display:grid; grid-template-columns:22px 36px 44px minmax(0,1fr) 40px; gap:12px; align-items:center; padding:6px 10px; border-radius:8px; cursor:pointer; }
  .qrow:hover { background:#ffffff0d; }
  .qrow .cover { width:44px; height:44px; }
  .qrow.played { opacity:.5; } .qrow.played:hover { opacity:.85; }
  .qbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .btn.ghost.on { border-color:var(--accent2); color:var(--accent2); }
  .qrow.cur { background:#ffffff10; cursor:default; }
  .qrow.cur .t { color:var(--accent2); } .qrow.cur .n { display:none; } .qrow.cur .eq { display:flex; }
  .qdel { opacity:0; background:none; border:0; color:var(--muted); cursor:pointer; width:32px; height:32px; padding:0; border-radius:10px; display:flex; align-items:center; justify-content:center; justify-self:center; }
  .qrow:hover .qdel { opacity:1; } .qdel:hover { color:var(--text); background:#ffffff14; }
  .chips { display:flex; flex-wrap:wrap; gap:12px; margin:18px 0 22px; }
  .chip { padding:12px 20px; border-radius:14px; border:1px solid #2a3140; background:#ffffff08; color:var(--text); cursor:pointer; font-weight:600; font-size:14px; display:flex; gap:9px; align-items:center; }
  .chip:hover { background:#ffffff12; }
  .chip.on { background:var(--accent); border-color:var(--accent2); }
  .badge { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; background:#ffffff14; color:var(--accent2); padding:4px 10px; border-radius:20px; vertical-align:middle; margin-left:8px; }
  .djnote { margin-top:22px; padding:18px 20px; border-radius:12px; background:#ffffff08; border-left:3px solid var(--accent2); line-height:1.6; max-width:640px; }
  .eqbox { background:#ffffff08; border-radius:12px; padding:16px 18px 12px; margin-bottom:10px; }
  .eqbox.off .eqbands { opacity:.35; pointer-events:none; }
  .eqtop { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .eqtop select { background:#070a0f; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; outline:none; cursor:pointer; }
  .eqbands { display:flex; gap:2px; align-items:flex-end; overflow-x:auto; padding-bottom:6px; }
  .eqband { flex:1; min-width:46px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .eqs { position:relative; width:100%; height:170px; }
  .eqs::before { content:''; position:absolute; left:8px; right:8px; top:50%; height:1px; background:#ffffff1c; }
  .eqs input[type=range], .eqs input[type=range]:hover { position:absolute; left:50%; top:50%; width:160px; height:5px; margin:0; transform:translate(-50%,-50%) rotate(-90deg); background:#2a3142; }
  .eqs input[type=range]::-webkit-slider-thumb, .eqs input[type=range]:hover::-webkit-slider-thumb { opacity:1; width:15px; height:15px; background:#fff; box-shadow:0 0 0 3px #00000040; }
  .eqv { font-size:11.5px; font-weight:700; white-space:nowrap; } .eql { font-size:11.5px; color:var(--muted); }
  .revctl { display:flex; align-items:center; gap:14px; flex:none; } .revctl input { width:220px; } .revctl .eqv { width:38px; text-align:right; }
  .eqsep { width:1px; align-self:stretch; background:var(--line); margin:0 8px; }
  /* home */
  .featlbl { font-size:14px; color:#ffffffb0; margin-bottom:14px; }
  .feat { position:relative; z-index:0; flex:none; min-height:280px; margin:0 0 var(--gap); padding:36px 44px; display:flex; align-items:center; overflow:hidden; background:#11151e; border:1px solid var(--border); border-radius:var(--r); }
  .featglow { display:none; }   /* no accent colour behind album covers */
  #featBox { position:absolute; z-index:1; right:92px; top:calc(50% + 14px); height:min(76%,236px); aspect-ratio:1; transform:translateY(-50%); transition:opacity .3s; }
  .featpic { position:absolute; inset:0; background-size:cover; background-position:center; border-radius:16px; box-shadow:0 22px 50px #000000a0; }
  /* artist photo: fills the whole box, no fade; one even dark layer keeps the text readable */
  .feat.photo #featBox { right:0; top:0; left:0; width:auto; height:auto; bottom:0; aspect-ratio:auto; transform:none; }
  .feat.photo .featpic { border-radius:0; box-shadow:none; background-size:cover; background-position:center 20%; }
  .feat.photo .featpic::after { content:''; position:absolute; inset:0; background:rgba(6,8,13,.6); }
  .feat.photo .featbody { text-shadow:0 2px 14px #0008; }
  .featbody { position:relative; z-index:2; max-width:52%; transition:opacity .22s; }
  .feat.swap #featBox, .feat.swap .featbody { opacity:0; }
  .ftitle { font-size:clamp(24px,2.7vw,36px); font-weight:800; letter-spacing:-.025em; line-height:1.12; margin:0 0 10px;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .fartist { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .fartist b { font-size:17px; font-weight:700; cursor:pointer; } .fartist b:hover { text-decoration:underline; }
  .fartist span { color:var(--muted); font-size:15px; font-weight:600; }
  .fbtns { display:flex; gap:8px; align-items:center; margin-top:24px; flex-wrap:wrap; }
  .fbtns .btn { height:38px; padding:0 18px; font-size:13px; gap:7px; border-radius:10px; }
  .fbtns .btn.icon { width:38px; padding:0; justify-content:center; }
  .fbtns .btn svg { width:15px; height:15px; }
  .fbtns .btn.on svg { fill:currentColor; }
  .fnav { position:absolute; right:22px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:center; gap:10px; z-index:2; }
  .fdot { width:5px; height:5px; border-radius:50%; background:#ffffff55; border:0; padding:0; cursor:pointer; transition:all .2s; }
  .fdot.on { background:#fff; height:18px; border-radius:3px; }
  .fchev { background:none; border:0; color:#ffffffaa; cursor:pointer; padding:4px; display:flex; } .fchev:hover { color:#fff; }
  .panel { margin-top:34px; }   /* no box any more: sections sit straight on the page */
  .panel .secthead { margin:0 0 14px; }
  .secthead { display:flex; align-items:baseline; justify-content:space-between; margin:36px 0 14px; }
  .secthead h2 { margin:0; } .secthead span { color:var(--muted); font-size:12.5px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .stat { min-width:0; padding:16px 18px; background:#ffffff08; border-radius:14px; }
  .stat.click { cursor:pointer; } .stat.click:hover .sv { color:var(--accent2); }
  .stat .sv { font-size:30px; font-weight:800; line-height:1.1; letter-spacing:-.015em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .15s; }
  .stat .sv.sm { font-size:20px; padding:5px 0; }
  .stat .sk { font-size:12px; color:var(--muted); font-weight:600; margin:5px 0 3px; }
  .delta { font-size:12px; color:var(--muted); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .delta.up { color:#5fd39a; } .delta.down { color:#e07a86; }
  .week { margin-top:12px; background:#ffffff06; border-radius:14px; padding:18px 20px 12px; }
  .bars { display:flex; gap:10px; height:110px; align-items:stretch; }
  .bar { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; }
  .bar em { font-style:normal; font-size:10.5px; color:var(--muted); height:13px; }
  .bar .bt { flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; }
  .bar i { display:block; width:100%; max-width:34px; border-radius:7px 7px 3px 3px; background:var(--accent2); opacity:.45; }
  .bar.today i { opacity:1; } .bar.zero i { background:#ffffff12; opacity:1; }
  .bar span { font-size:11px; color:var(--muted); } .bar.today span { color:var(--text); font-weight:700; }
  .wknote { margin-top:8px; font-size:12px; color:var(--muted); }
  .mnav { display:flex; align-items:center; gap:4px; }
  .mnav b { font-size:12.5px; font-weight:600; color:var(--muted); min-width:104px; text-align:center; }
  .mnav .chevbtn { width:28px; height:28px; }
  .mnav .chevbtn:disabled { opacity:.3; cursor:default; }
  .rank { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(5,auto); grid-auto-flow:column; gap:6px 30px; }
  .rk { display:flex; align-items:center; gap:14px; padding:8px 12px 8px 8px; border-radius:14px; cursor:pointer; min-width:0; }
  .rk.card { background:none; } .rk.card:hover, .rk:hover { background:#ffffff0f; }
  .rk .rn { flex:none; width:24px; text-align:center; font-size:15px; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums; }
  .rk:nth-child(-n+3) .rn { color:var(--accent2); }
  .rk .cover { width:54px; height:54px; flex:none; margin:0; border-radius:10px; box-shadow:0 4px 12px #0005; font-size:20px; }
  .rk.round .cover { border-radius:50%; }
  .rk .rtx { flex:1; min-width:0; }
  .rk .ct { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rk .cs { color:var(--muted); font-size:12.5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rk .rpl { flex:none; font-size:12px; font-weight:700; color:var(--muted); background:#ffffff0d; padding:4px 9px; border-radius:20px; }
  .rk .cact { position:static; opacity:0; flex:none; } .rk:hover .cact { opacity:1; }
  .rkempty { color:var(--muted); font-size:13.5px; padding:18px 4px; }
  .hrow { display:flex; gap:16px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px; }
  .hrow .card { width:158px; flex:none; }
  .nameinp { background:#070a0f; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; width:200px; outline:none; }
  .nameinp:focus { border-color:var(--accent2); }
  .setrow { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:16px 18px; background:#ffffff08; border-radius:12px; margin-bottom:10px; }
  .sl { font-weight:700; font-size:15px; }
  .sd { color:var(--muted); font-size:13px; margin-top:4px; max-width:540px; overflow-wrap:anywhere; line-height:1.5; }
  .seg { display:flex; background:#070a0f; border-radius:10px; padding:3px; gap:2px; flex:none; }
  .segbtn { border:0; background:none; color:var(--muted); padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:700; font-size:13px; }
  .segbtn:hover { color:var(--text); } .segbtn.on { background:var(--accent); color:#fff; }

  /* slim, rounded scrollbars: only a thin pill shows, and it brightens when you reach for it */
  ::-webkit-scrollbar { width:10px; height:10px; background:transparent; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background:transparent; }
  ::-webkit-scrollbar-button { display:none; width:0; height:0; }
  ::-webkit-scrollbar-thumb { background:#ffffff1f; background-clip:content-box; border:3px solid transparent; border-radius:10px; min-height:36px; min-width:36px; transition:background .2s; }
  :hover > ::-webkit-scrollbar-thumb { background-color:#ffffff2e; }
  ::-webkit-scrollbar-thumb:hover { background:#ffffff4d; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:active { background:var(--accent2); background-clip:content-box; }

  /* ---------- polish pass ---------- */
  /* smooth hovers (instead of snapping) */
  .nav, .row, .plitem, .pk, .upn, .qrow, .chip, .segbtn, .mi, .ic, .backbtn, .folderbtn, .plplus, .act, .cact, .qdel, .stat, .hav
    { transition:background-color .15s ease, color .15s ease, border-color .15s ease, opacity .15s ease, filter .15s ease, transform .15s ease; }
  .btn { transition:filter .15s ease, border-color .15s ease, color .15s ease, background-color .15s ease, transform .1s ease; }
  .btn:active, .nav:active, .chip:active { transform:scale(.97); }
  /* keyboard focus in the app colours (mouse clicks don't show it) */
  button:focus-visible, .nav:focus-visible, .chip:focus-visible { outline:2px solid var(--accent2); outline-offset:2px; }
  input[type=range]:focus-visible { outline:2px solid var(--accent2); outline-offset:5px; }
  .searchbox:focus-within { background:#ffffff1c; }
  /* hover-only buttons also show up when you tab to them */
  .row:focus-within .act, .act:focus-visible, .card:focus-within .cact, .cact:focus-visible, .qrow:focus-within .qdel, .qdel:focus-visible { opacity:1; }
  /* slider dot shows while dragging / focused too */
  input[type=range]:active::-webkit-slider-thumb, input[type=range]:focus-visible::-webkit-slider-thumb { opacity:1; }
  /* things fade/slide in instead of popping */
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes popIn { from { opacity:0; transform:translateY(-6px) scale(.97); } to { opacity:1; transform:none; } }
  @keyframes modalIn { from { opacity:0; transform:translateY(10px) scale(.97); } to { opacity:1; transform:none; } }
  @keyframes toastIn { from { opacity:0; transform:translate(-50%,8px); } to { opacity:1; transform:translate(-50%,0); } }
  @keyframes toastOut { to { opacity:0; transform:translate(-50%,8px); } }
  .menu { animation:popIn .14s ease-out; }
  .modalbg { animation:fadeIn .15s ease-out; }
  .modal { animation:modalIn .18s ease-out; }
  .toast { animation:toastIn .2s ease-out, toastOut .25s ease-in 1.55s forwards; }

  body { font-family:"Manrope","Segoe UI",sans-serif; }
  input, select, textarea { font-family:inherit; }
  h1,h2,h3,.brand,.ftitle,.hinfo h1,.dhead h1,.rt,.aln,.ct,.pn,.sl,.rhead,.plhead,.sv,.nav,.btn,.t,.segbtn,.chip { font-family:"Urbanist","Manrope",sans-serif; }
  h1 { font-weight:700; letter-spacing:-.02em; } h2 { font-weight:600; }
  .brand,.ftitle,.hinfo h1,.dhead h1,.rt,.aln,.sv { font-weight:700; }
  .time,.num,.alb,.delta,.sk { font-variant-numeric:tabular-nums; }
  /* only search-style boxes are pill shaped; everything else keeps its original shape */
  .searchbox, .nameinp, .eqtop select { border-radius:999px; }
  /* albums: just cover + title + year; the box only appears when you hover */
  .card.albcard { background:none; }
  .card.albcard:hover { background:#ffffff14; }

  /* ---------- artist page ---------- */
  .ahero { position:relative; margin:0 -30px; padding:44px 40px 34px; min-height:270px; display:flex; align-items:center; justify-content:space-between; gap:32px; overflow:hidden; background:#15111c; }
  .abg { position:absolute; inset:0; z-index:0; background-position:center 20%; background-size:cover; background-repeat:no-repeat; }
  .ahero.soft .abg { filter:blur(22px) saturate(1.15); transform:scale(1.15); }   /* photos we looked up are square, so soften them into a clean backdrop instead of stretching them */
  .ahero::after { content:''; position:absolute; inset:0; z-index:0; pointer-events:none; background:linear-gradient(90deg,rgba(11,14,21,.9) 0%,rgba(11,14,21,.55) 45%,rgba(11,14,21,.22) 100%),linear-gradient(180deg,rgba(11,14,21,0) 55%,#0b0e15 100%); }
  .ainfo { position:relative; z-index:1; min-width:0; max-width:600px; }
  .akind { font-size:12.5px; color:#ffffffb0; font-weight:600; margin-bottom:6px; }
  .aname { font-size:clamp(30px,3.6vw,46px); line-height:1.05; letter-spacing:-.025em; margin:0 0 12px; overflow-wrap:anywhere; }
  .abio { color:#e9ebf1cc; font-size:14px; line-height:1.6; margin:0; max-width:540px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .abio.none { color:var(--muted); font-style:italic; }
  .aact { display:flex; align-items:center; gap:10px; margin-top:18px; }
  .aact .btn.icon { width:40px; height:40px; padding:0; justify-content:center; }
  .ahero .hav { position:relative; z-index:1; flex:none; width:clamp(104px,11vw,160px); height:clamp(104px,11vw,160px); border:0; background-position:center 22%;
                box-shadow:0 0 0 4px rgba(11,14,21,.55), 0 0 0 5.5px rgba(255,255,255,.22), 0 18px 40px rgba(0,0,0,.55); }
  .app:not(.showRight) .ahero .hav { width:clamp(130px,14vw,210px); height:clamp(130px,14vw,210px); margin-right:clamp(24px,5vw,90px); }
  .ahero .hav { transition:width .35s ease, height .35s ease, margin .35s ease; }
  .chevs { display:flex; gap:6px; }
  .chevbtn { width:32px; height:32px; border:0; border-radius:50%; background:#ffffff12; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .chevbtn:hover:not(:disabled) { background:#ffffff24; } .chevbtn:disabled { opacity:.3; cursor:default; }
  .relrow { scrollbar-width:none; } .relrow::-webkit-scrollbar { display:none; }
  .agrid { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr); gap:34px; align-items:start; }
  @media (max-width:1100px) { .agrid { grid-template-columns:1fr; } }
  .simart { display:flex; align-items:center; gap:14px; padding:8px; border-radius:12px; cursor:pointer; }
  .simart:hover { background:#ffffff0d; } .simart.off { cursor:default; opacity:.8; }
  .simpic { width:54px; height:54px; border-radius:50%; flex:none; background:#1d2028 center/cover no-repeat; display:flex; align-items:center; justify-content:center; color:#ffffffaa; }
  .simart .sn { font-family:"Urbanist","Manrope",sans-serif; font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .simart .ss { font-size:12.5px; color:var(--muted); margin-top:2px; }
  .modal.bio { width:520px; max-width:90vw; }
  .biotext { white-space:pre-wrap; line-height:1.65; font-size:14px; color:#e9ebf1cc; max-height:46vh; overflow-y:auto; user-select:text; margin-bottom:12px; }
  .modal textarea { width:100%; min-height:180px; resize:vertical; background:#070a0f; border:1px solid #3a4254; border-radius:10px; color:var(--text); padding:11px 14px; font:inherit; font-size:14px; outline:none; user-select:text; margin-bottom:12px; }
  .modal textarea:focus { border-color:var(--accent2); }
  .biosrc { font-size:12px; color:var(--muted); margin-bottom:8px; } .biosrc a { color:var(--accent2); cursor:pointer; }

  /* wordmark */
  .brand { padding-bottom:14px; } .brand .wm { width:136px; height:auto; min-width:0; display:block; filter:drop-shadow(0 3px 8px #0008); }

  .ftitle, .rt { font-family:"Outfit","Urbanist",sans-serif; font-weight:800; letter-spacing:-.02em; }

  /* ---------- glossy burgundy buttons ---------- */
  :root { --gloss: linear-gradient(180deg, rgba(255,255,255,.10) 0, rgba(255,255,255,.02) 48%, rgba(255,255,255,0) 52%),
                   linear-gradient(180deg, color-mix(in srgb, var(--btn) 80%, var(--tacc)) 0%, var(--btn) 55%, color-mix(in srgb, var(--btn) 84%, #000) 100%); }
  .btn:not(.ghost), #play, .segbtn.on, .chip.on, .toast, .pk.in .pkb { background:var(--gloss); box-shadow:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 2px rgba(0,0,0,.2), 0 1px 4px rgba(0,0,0,.28); }
  .segbtn.on { box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 2px rgba(0,0,0,.2); }
  .chip.on { border-color:var(--accent2); }

  /* ---------- play button: soft press, one small overshoot, no glow ---------- */
  #play { transition:transform .14s ease-out, box-shadow .2s; }
  #play:hover { transform:none; filter:none; }
  #play:active { transform:scale(.92); transition-duration:.08s; }
  #play.bounce { animation:playBounce .42s cubic-bezier(.3,.7,.3,1); }
  #play svg { animation:none; }
  #play svg.pop { animation:iconPop .26s cubic-bezier(.2,.9,.3,1); }
  @keyframes playBounce { 0% { transform:scale(.92); } 55% { transform:scale(1.045); } 100% { transform:scale(1); } }
  @keyframes iconPop { 0% { transform:scale(.62) rotate(-40deg); opacity:0; } 100% { transform:none; opacity:1; } }
  @media (prefers-reduced-motion:reduce) { #play, #play svg, #play.bounce { animation:none !important; transition:none !important; } .cspop { animation:none; } }

  /* ---------- welcome card: like + shuffle are plain icons ---------- */
  .fbtns .ficon { width:38px; height:38px; padding:0; border:0; border-radius:10px; background:none; color:#ffffffc4; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:color .15s, background-color .15s, transform .15s; }
  .fbtns .ficon:hover { color:#fff; background:#ffffff14; }
  .fbtns .ficon:active { transform:scale(.86); }
  .fbtns .ficon svg { width:21px; height:21px; }
  .fbtns .ficon.on { color:var(--accent2); }
  .fbtns .ficon { position:relative; }
  .fbtns #fShuffle { color:var(--muted); } .fbtns #fShuffle:hover { color:var(--text); } .fbtns #fShuffle.on { color:var(--accent2); }
  .fbtns #fShuffle svg { width:20px; height:20px; }
  #fShuffle::after { content:""; position:absolute; left:50%; bottom:4px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--accent2); transform:scale(0); transition:transform .2s cubic-bezier(.3,1.6,.5,1); }
  #fShuffle.on::after { transform:scale(1); }
  #fShuffle.flip svg { animation:shufFlip .38s cubic-bezier(.3,.8,.3,1); }
  @keyframes shufFlip { 0% { transform:scale(.8) rotate(-14deg); } 60% { transform:scale(1.12) rotate(4deg); } 100% { transform:none; } }
  @media (prefers-reduced-motion:reduce) { #fShuffle.flip svg { animation:none; } }
  #fHeart.on svg { fill:currentColor; }

  /* ---------- modern dropdown ---------- */
  .csel { display:inline-flex; align-items:center; gap:10px; min-width:220px; height:38px; padding:0 10px 0 14px; background:#ffffff0d; border:1px solid #ffffff14; border-radius:12px; color:var(--text); font-size:13.5px; font-weight:600; cursor:pointer; outline:none; transition:background .15s, border-color .15s; }
  .csel:hover { background:#ffffff16; }
  .csel:focus-visible, .csel.open { border-color:var(--accent2); background:#ffffff16; }
  .csel.wide { display:flex; width:100%; height:42px; font-size:15px; }
  .csel .cst, .cspop .cst { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .csc { display:flex; color:var(--muted); transition:transform .2s; }
  .csel.open .csc { transform:rotate(180deg); }
  .cscurve { display:flex; flex:none; color:var(--accent2); opacity:.9; } .cscurve svg { display:block; }
  .cspop { position:fixed; z-index:80; background:#11151e; border:1px solid #262c3b; border-radius:14px; padding:6px; box-shadow:0 18px 44px #000b; overflow-y:auto; transform-origin:top left; animation:cspop .16s cubic-bezier(.2,.9,.3,1); }
  @keyframes cspop { from { opacity:0; transform:translateY(-6px) scale(.97); } to { opacity:1; transform:none; } }
  .csgl { padding:10px 10px 4px; font-size:11.5px; font-weight:700; color:var(--muted); }
  .csi { display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:9px; cursor:pointer; font-size:13.5px; font-weight:600; }
  .csi:hover, .csi.hl { background:#ffffff12; } .csi.sel { color:var(--accent2); }
  .csck { display:flex; width:14px; flex:none; color:var(--accent2); }
  .eqcurve { height:56px; margin:-4px 4px 14px; color:var(--accent2); opacity:.85; } .eqcurve svg { display:block; width:100%; height:100%; }

  /* ---------- miniplayer button in the player bar ---------- */
  #miniBtn svg { width:19px; height:19px; }
</style>

function guessType(name, arr) {

  if (/[-\u2013(\[]\s*single\s*[)\]]?\s*$/.test(n)) return 'Single';
  if (/(^|[\s(\[-])ep([)\]\s]|$)/.test(n)) return 'EP';
  if (/deluxe|\bvol(ume|\.)?\s*\d/.test(n)) return 'Album';
  const count = Math.max(arr.length, ...arr.map(s => s.track || 0), ...arr.map(s => s.trackTotal || 0));

function fmtDur(total) {

function computeDuration(list, elId) {

    const finish = () => { done++; if (done === list.length) { const el = document.getElementById(elId); if (el && total > 0) el.textContent = '• ' + fmtDur(total); } };

  });
}

// Suggestions for the end of a playlist: same scoring the auto mix uses, averaged over the songs in the playlist
let plSugg = { id: null, paths: [] };
function suggestFor(p, list, force) {
  const inPl = new Set(p.songs);
  let keep = (!force && plSugg.id === p.id) ? plSugg.paths.filter(x => !inPl.has(x) && byPath.has(x)) : [];
  if (keep.length < 10) {
    const base = list.length > 24 ? shuf(list).slice(0, 24) : list;
    const have = new Set(keep), scored = [];
    for (const c of songs) {
      if (inPl.has(c.path) || have.has(c.path)) continue;
      let sc = 0; for (const b of base) sc += pairScore(b, c);
      sc = sc / base.length + Math.random() * 1.2;
      sc -= Math.min(3, mixData.skips[c.path] || 0);
      sc += Math.min(1.5, Math.log1p(playCounts[c.path] || 0) * 0.5);
      scored.push([sc, c]);
    }
    scored.sort((a, b) => b[0] - a[0]);
    const per = {}; keep.forEach(x => { const a = byPath.get(x).artists[0]; per[a] = (per[a] || 0) + 1; });
    for (const [, c] of scored) {
      if (keep.length >= 10) break;
      const a = c.artists[0]; if ((per[a] || 0) >= 3) continue;
      per[a] = (per[a] || 0) + 1; keep.push(c.path);
    }
  }
  plSugg = { id: p.id, paths: keep };
  return keep.map(x => byPath.get(x)).filter(Boolean);
}

$('vol').oninput = e => { master = +e.target.value; applyVol(0); applyVol(1); setP(e.target); save('vol', master); syncMute(); };
$('mute').onclick = () => {
  if (master > 0) { lastVol = master; master = 0; } else master = lastVol || 0.8;
  applyVol(0); applyVol(1); $('vol').value = master; setP($('vol')); syncMute();
};
$('seek').oninput = e => { const d = deck(); if (d.duration) d.currentTime = (e.target.value / 100) * d.duration; setP(e.target); };

decks.forEach((d, i) => {
  d.onplay = () => { if (i === ai) { document.body.classList.remove('paused'); setPlayIcon(); miniPush(); } };
  d.onpause = () => { if (i === ai) { document.body.classList.add('paused'); setPlayIcon(); miniPush(); } };
  d.onended = () => { if (i !== ai) return; if (repeat === 2) { d.currentTime = 0; d.play(); } else nextSong(true, 0); };
  d.onerror = () => { if (i === ai && d.getAttribute('src')) toast("This one won't play, sorry"); };
  d.ontimeupdate = () => {
    if (i !== ai) return;
    $('cur').textContent = fmt(d.currentTime);
    $('dur').textContent = fmt(d.duration);
    miniTick();
    if (d.duration) { $('seek').value = (d.currentTime / d.duration) * 100; setP($('seek')); }
  };
});

// watches the playing song; when it is close to the end, start blending into the next one
setInterval(() => {
  if (!cur || fade || !settings.xfade || repeat === 2) return;
  const d = deck(); if (d.paused) return;
  const dur = d.duration; if (!isFinite(dur) || dur < 8) return;
  const x = Math.min(settings.xfade, dur * 0.4);
  if (dur - d.currentTime <= x + 0.1 && hasNext()) nextSong(true, x);
}, 150);

document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  else if (e.code === 'ArrowRight') { if (e.ctrlKey) nextSong(false); else deck().currentTime += 5; }
  else if (e.code === 'ArrowLeft') { if (e.ctrlKey) prevSong(); else deck().currentTime -= 5; }
});


/* ---------- miniplayer (its own small window; the music keeps playing from this one) ---------- */
let miniOn = false, miniTickT = 0;
async function miniState() {
  const s = cur, d = deck();
  let cover = null; if (s) cover = s.coverOverride || await getCover(s.path);
  return { has: !!s, title: s ? s.title : '', artist: s ? s.artist : '', cover, bg: s ? grad(s.album) : '', paused: d.paused, cur: d.currentTime || 0, dur: isFinite(d.duration) ? d.duration : 0 };
}
async function miniPush() {
  if (!window.api.miniState) return;
  if (!miniOn) { window.api.miniState({ paused: deck().paused }); return; }   // miniplayer closed: still tell main.js so the taskbar play/pause button flips
  window.api.miniState(await miniState());
}
function miniTick() {
  if (!miniOn) return;
  const now = performance.now(); if (now - miniTickT < 250) return; miniTickT = now;
  const d = deck(); window.api.miniState({ paused: d.paused, cur: d.currentTime || 0, dur: isFinite(d.duration) ? d.duration : 0 });
}
$('miniBtn').onclick = async () => {
  if (!window.api.miniOpen) { toast('Replace main.js and preload.js to use the miniplayer'); return; }
  if (!cur) { toast('Play a song first'); return; }
  miniOn = true; await window.api.miniOpen(await miniState());
};
if (window.api.onMiniCmd) {
  window.api.onMiniCmd((cmd, arg) => {
    if (cmd === 'toggle') togglePlay();
    else if (cmd === 'next') nextSong(false);
    else if (cmd === 'prev') prevSong();
    else if (cmd === 'seek') { const d = deck(); if (d.duration) d.currentTime = Math.max(0, Math.min(1, +arg || 0)) * d.duration; }
  });
  window.api.onMiniClosed(() => { miniOn = false; });
}

/* ---------- start ---------- */
fillIcons(document);
document.body.classList.add('paused');
master = load('vol', 0.8); applyVol(0); applyVol(1);
$('vol').value = master; setP($('vol')); setP($('seek')); syncMute(); setPlayIcon();
window.api.loadSaved().then(setLibrary);
</script>
</body>
